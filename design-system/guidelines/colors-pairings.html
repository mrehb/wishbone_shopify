<!-- @dsCard group="Colors" viewport="700x260" name="Pairings" subtitle="The brights carry ink type only" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;padding:20px">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
  <div style="background:var(--color-ink);border:1px solid var(--color-border-soft);padding:18px;color:#fff;font-size:13px">White on ink<br><b style="font-size:18px">16.45</b> ✓</div>
  <div style="background:var(--color-ink);border:1px solid var(--color-border-soft);padding:18px;color:var(--color-volt);font-size:13px">Volt on ink<br><b style="font-size:18px">14.25</b> ✓</div>
  <div style="background:var(--color-volt);padding:18px;color:var(--color-ink);font-size:13px">Ink on volt<br><b style="font-size:18px">14.25</b> ✓</div>
  <div style="background:var(--color-cyan);padding:18px;color:var(--color-ink);font-size:13px">Ink on cyan<br><b style="font-size:18px">12.65</b> ✓</div>
  <div style="background:var(--color-volt);padding:18px;color:#fff;font-size:13px">White on volt<br><b style="font-size:18px">1.15</b> ✗</div>
  <div style="background:#fff;padding:18px;color:var(--color-volt);font-size:13px">Volt on white<br><b style="font-size:18px">1.15</b> ✗</div>
  <div style="background:#fff;padding:18px;color:var(--color-cyan);font-size:13px">Cyan on white<br><b style="font-size:18px">1.30</b> ✗</div>
  <div style="background:var(--surface-panel);padding:18px;color:var(--text-muted);font-size:12.5px">Rule: volt and cyan<br>always take <b style="color:#fff">ink</b> type.<br>Never white type,<br>never type on white.</div>
</div>
</body></html>
