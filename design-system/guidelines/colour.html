<!-- @dsCard group="Foundations" viewport="700x200" name="Colour" subtitle="One ground, one tile, one lime" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;padding:24px">
<div style="display:flex;height:120px;border-radius:var(--r-tile);overflow:hidden">
  <div style="flex:2;background:#0f1014;display:flex;flex-direction:column;justify-content:flex-end;padding:14px" class="label"><b>ground</b>#0F1014</div>
  <div style="flex:1.4;background:#111214;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;box-shadow:inset 0 1px 0 rgb(255 255 255/.06)" class="label"><b>tile</b>#111214</div>
  <div style="flex:1;background:#8e9298;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#0f1014" class="label" style="color:#0f1014">grey #8E9298</div>
  <div style="flex:1;background:#fafafa;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#0f1014" class="label">white #FAFAFA</div>
  <div style="flex:1.4;background:#a8ff4a;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#0f1014" class="label"><b style="color:#0f1014">lime</b>#A8FF4A</div>
</div>
<p class="grey" style="font-size:var(--fs-label);letter-spacing:.06em;margin-top:14px">Lime is hue 89° — the hardware's green, not the yellow-green of the old theme. Lime on ground 15.5:1 · ground on lime 15.5:1 · white on lime 1.18:1 (never). No red anywhere: attention is lime.</p>
</body></html>
