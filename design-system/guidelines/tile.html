<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;padding:24px">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--grid-gap)">
  <div style="background:var(--tile);border-radius:var(--r-tile);padding:var(--pad);box-shadow:inset 0 1px 0 var(--tile-edge);height:150px"><div class="label"><b>01</b>&nbsp;&nbsp;label</div></div>
  <div style="background:var(--tile);border-radius:var(--r-tile);padding:var(--pad);box-shadow:inset 0 1px 0 var(--tile-edge);height:150px"><div class="label"><b>02</b>&nbsp;&nbsp;label <i style="width:6px;height:6px;border-radius:50%;background:var(--lime);display:inline-block;margin-left:8px"></i></div></div>
  <div style="background:var(--tile);border-radius:var(--r-tile);padding:var(--pad);box-shadow:inset 0 1px 0 var(--tile-edge);height:150px"><div class="label"><b>03</b>&nbsp;&nbsp;label</div></div>
</div>
<p class="grey" style="font-size:var(--fs-label);letter-spacing:.06em;margin-top:14px">24px radius · 24px padding · 16px gap · 1px top-light edge · numbered label top-left. Spans 1, 2 or 3 columns. There is no other box in the system.</p>
</body></html>
