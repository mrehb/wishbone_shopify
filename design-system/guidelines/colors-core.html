<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0">
<div style="display:flex;height:150px">
<div style="flex:2;background:var(--color-ink);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-size:12px;border-right:1px solid var(--color-border-soft)"><b>INK</b>#1F1F21 · the ground</div>
<div style="flex:1;background:var(--color-white);color:var(--color-ink);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-size:12px"><b>WHITE</b>#FFFFFF · type &amp; marks</div>
<div style="flex:1.2;background:var(--color-volt);color:var(--color-ink);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-size:12px"><b>VOLT</b>#E3FC02 · action</div>
<div style="flex:1;background:var(--color-cyan);color:var(--color-ink);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-size:12px"><b>CYAN</b>#00FCED · accent</div>
</div>
</body></html>
