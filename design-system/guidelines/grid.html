<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;padding:24px">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--grid-gap)">
  <div style="grid-column:span 3;height:54px;background:var(--tile);border-radius:var(--r-tile);box-shadow:inset 0 1px 0 var(--tile-edge)"></div>
  <div style="grid-column:span 2;height:54px;background:var(--tile);border-radius:var(--r-tile);box-shadow:inset 0 1px 0 var(--tile-edge)"></div>
  <div style="height:54px;background:var(--tile);border-radius:var(--r-tile);box-shadow:inset 0 1px 0 var(--tile-edge)"></div>
  <div style="height:54px;background:var(--tile);border-radius:var(--r-tile);box-shadow:inset 0 1px 0 var(--tile-edge)"></div>
  <div style="height:54px;background:var(--tile);border-radius:var(--r-tile);box-shadow:inset 0 1px 0 var(--tile-edge)"></div>
  <div style="height:54px;background:var(--tile);border-radius:var(--r-tile);box-shadow:inset 0 1px 0 var(--tile-edge)"></div>
</div>
<p class="grey" style="font-size:var(--fs-label);letter-spacing:.06em;margin-top:14px">Page 1200px. Three columns above 900, two above 600, one below. Tiles span 1–3. Every page is a board — home, product, collection, cart, account.</p>
</body></html>
