<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;padding:24px">
<div style="display:flex;height:60px;border:1px solid var(--color-border-soft)">
  <div style="background:var(--color-ink);flex:70;display:flex;align-items:center;padding-left:14px;font-size:12px;color:#fff">70 % INK</div>
  <div style="background:var(--color-white);flex:20;display:flex;align-items:center;padding-left:14px;font-size:12px;color:var(--color-ink)">20 %</div>
  <div style="background:var(--color-volt);flex:10"></div>
</div>
<p class="muted" style="font-size:13px;margin:14px 0 0">Ink is the ground, white is the type, volt is the one thing you want clicked.
Cyan is a guest — one element per page, never beside volt at equal size.</p>
</body></html>
