<!-- @dsCard group="Geometry" viewport="700x230" name="Radius & surfaces" subtitle="v2 inverts v1 — soft, layered, still flat" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;padding:24px">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
  <div><div style="height:76px;background:var(--surface-card);border:1px solid var(--color-border);border-radius:var(--radius-card)"></div>
    <div class="label" style="margin-top:10px">CARD · 20PX</div></div>
  <div><div style="height:76px;background:var(--surface-raised);border:1px solid var(--color-border-strong);border-radius:var(--radius-control)"></div>
    <div class="label" style="margin-top:10px">CONTROL · 10PX</div></div>
  <div><div style="height:76px;background:var(--surface-card);border:1px solid var(--color-border);border-radius:var(--radius-media)"></div>
    <div class="label" style="margin-top:10px">MEDIA · 16PX</div></div>
  <div><div style="height:76px;border:1px solid var(--color-border-strong);border-radius:var(--radius-pill)"></div>
    <div class="label" style="margin-top:10px">PILL · FULL</div></div>
</div>
<p class="muted" style="font-size:12.5px;margin-top:16px"><b style="color:#fafafa">This is the reversal.</b> v1 was square everywhere with pills as the lone exception;
v2 is soft everywhere and the pill is simply consistent. Depth still comes from surface steps and the warm wash — <b style="color:#fafafa">there are still no drop shadows</b>.</p>
</body></html>
