<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;padding:24px">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px">
  <div><div style="height:80px;background:var(--surface-panel);border:1px solid var(--color-border-soft);border-radius:var(--radius)"></div>
    <div style="font-size:12.5px;margin-top:8px"><b>Radius 0</b><br><span class="muted">buttons · cards · inputs · media</span></div></div>
  <div><div style="height:80px;background:var(--surface-panel);border:1px solid var(--color-border-soft);border-radius:var(--radius-pill)"></div>
    <div style="font-size:12.5px;margin-top:8px"><b>Pill 40</b><br><span class="muted">variant selectors only</span></div></div>
  <div><div style="height:80px;border:1px solid var(--color-border)"></div>
    <div style="font-size:12.5px;margin-top:8px"><b>Hairline 1px · 55 %</b><br><span class="muted">never heavy rules</span></div></div>
</div>
<p class="muted" style="font-size:12.5px;margin:16px 0 0"><b style="color:#fff">No shadows anywhere</b> — every theme surface ships shadow opacity 0.
Anything arriving with a radius, a drop shadow or a gradient is off-brand, however good it looks alone.</p>
</body></html>
