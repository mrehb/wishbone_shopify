<div style="border:1px dashed var(--color-border);border-radius:var(--radius-card);padding:16px">

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:14px">
    <div style="height:56px;background:var(--surface-card);border:1px solid var(--color-border);border-radius:var(--radius-card)"></div>

  </div>

</div>
<p class="muted" style="font-size:12.5px;margin-top:14px">Page narrows 1600 → <b style="color:#fafafa">1440px</b> and sections breathe wider (52 → <b style="color:#fafafa">72px</b>):
