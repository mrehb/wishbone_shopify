<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;padding:24px">
<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:var(--grid-gap)">
  <div style="background:var(--tile);border-radius:var(--r-tile);padding:var(--pad);box-shadow:inset 0 1px 0 var(--tile-edge);display:flex;align-items:center;justify-content:center">
    <div style="border:1px dashed rgb(168 255 74/.4);border-radius:12px;padding:22px;width:100%;display:flex;justify-content:center"><img src="../assets/wishbone-wordmark.png" style="width:82%"></div></div>
  <div style="background:var(--tile);border-radius:var(--r-tile);padding:var(--pad);box-shadow:inset 0 1px 0 var(--tile-edge);display:flex;align-items:center;justify-content:center">
    <img src="../assets/wishbone-monogram-lime.png" style="width:64%"></div>
</div>
<p class="grey" style="font-size:var(--fs-label);letter-spacing:.06em;margin-top:14px">Wordmark: white, header 200px, min 120px, clear space = height of the W. Monogram: recut with the cut in lime #A8FF4A (was olive #C8D645). Both are white marks — ground, dark photography, or a lime tile only. Still missing: positive + SVG versions.</p>
</body></html>
