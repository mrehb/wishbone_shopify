<!-- @dsCard group="Components" viewport="720x400" name="Commerce" subtitle="ProductCard, SpecPanel, DotMatrix silhouette" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body style="margin:0;background:var(--color-carbon)">
<div id="root"></div>
<script>window.__dsReady = new Promise(function(res){var t0=Date.now();(function poll(){if(window.WishboneGolfDesignSystem_4d0e77){res(true)}else if(Date.now()-t0>8000){document.getElementById('root').innerHTML='<div style="padding:24px;font-family:sans-serif;font-size:13px;color:#fff">Design-system bundle not loaded yet (_ds_bundle.js). Reload the page.</div>';res(false)}else{setTimeout(poll,100)}})()});</script>
<script type="text/babel" data-ds-deferred="true">
const ns = window.WishboneGolfDesignSystem_4d0e77 || {};
const { ProductCard, SpecPanel, DotMatrix } = ns;
// A stand-in silhouette grid; real cards sample a product photo's luminance.
const C = 40, R = 26, vals = [], acc = [];
for (let y=0; y<R; y++) for (let x=0; x<C; x++){
  const i=y*C+x;
  const wheel = Math.abs(Math.hypot(x-9,y-18)-5.5)<1.4 || Math.abs(Math.hypot(x-31,y-18)-5.5)<1.4;
  const frame = (y>7 && y<9 && x>8 && x<32) || (Math.abs((x-9)*0.55-(y-18))<0.8 && x>8 && x<22);
  const handle = (Math.abs(x-30)<1 && y>3 && y<9);
  const v = wheel||frame||handle ? 1 : 0;
  vals.push(v);
  if (v && handle) acc.push(i);
}
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{padding:'24px', display:'flex', flexDirection:'column', gap:22}}>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'var(--grid-gap)'}}>
      <ProductCard title="Wishbone EON" type="Electric trolley" price="799,00 €" badge="best">
        <DotMatrix values={vals} cols={C} rows={R} accent={acc} size={4} gap={2} />
      </ProductCard>
      <ProductCard title="Wishbone THREE" type="Manual trolley" price="249,00 €" />
      <ProductCard title="Fast Charger (NEO & EON)" type="Spare part" price="99,90 €" soldOut />
    </div>
    <SpecPanel specs={[
      {label:'Range', value:'27+', unit:'holes', note:'Lithium, one charge', levels:[1,.9,.8,.7,.6,.45,.3,.2]},
      {label:'Frame', value:'AL', note:'Aircraft-grade aluminium'},
      {label:'Fold size', value:'—', note:'Not yet measured'},
    ]} />
  </div>
);
</script>
</body></html>
